<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathScript Playground</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="./playground-style.css">
<link rel="icon" href="../MS.ico">

<!-- Prism.js CSS y JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/themes/prism-okaidia.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-bash.min.js"></script>
</head>
<body>
<header>
    <h1 style="color: #f0f0f0; padding-left: 2%;">MathScript Playground</h1>
    <p style="color: #f0f0f0; padding-left: 2%;">Escribe código MS y transpílalo a JS directamente.</p>
</header>

<main>
<textarea id="editor" placeholder="Escribe tu código MathScript aquí...">
// Ejemplo MS:
let x = 5
console.log(x)
x =  10
console.log(x)
immut x

fn saludo(nombre) {
    return `Hola ${nombre}`
}
console.log(saludo("Ian"))
</textarea>
<br>
<button id="runButton">Transpilar y Ejecutar</button>
<div id="console"></div>

</main>

<footer>
MathScript &copy; 2026 - <a href="https://github.com/IanLangs/Mathscript">Repositorio GitHub</a>
</footer>

<script type="module" src="./playground.js"></script>
</body>
</html>
