name: Index DEBs

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate index.json
        run: |
          echo "[" > index.json
          first=true
          for f in *.deb; do
            [ -e "$f" ] || continue
            name="${f%.deb}"
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> index.json
            fi
            echo "  \"$name\"" >> index.json
          done
          echo "]" >> index.json

      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.json
          git commit -m "Update index.json" || exit 0
          git push
